[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-rocm"
version = "0.1.0"
description = "Drop-in AMD ROCm runtime for Laya, the calibrated System 1 decision engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["laya", "rocm", "amd", "hip", "decision-model", "calibration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# torch is deliberately not pinned here: install the ROCm wheel for your GPU first, then this.
dependencies = ["laya>=0.3.5,<0.4"]

[project.urls]
Homepage = "https://github.com/don-milsey-miller/laya-ROCm"
Issues = "https://github.com/don-milsey-miller/laya-ROCm/issues"
Upstream = "https://github.com/NandhaKishorM/laya"

[project.optional-dependencies]
bench = ["datasets>=2.18", "pandas", "matplotlib"]
test = ["pytest>=7"]

[project.scripts]
laya-rocm = "laya_rocm.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["model: downloads a Laya checkpoint (slow)", "gpu: needs a ROCm GPU"]
